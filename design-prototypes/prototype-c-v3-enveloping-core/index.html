<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Self-Awake Prototype C V3：意识核心从黑暗中形成、扩张，并以无方向曲面包覆观察者。"
    />
    <title>包覆核心 — Self-Awake C / V3</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M12.7 3.2 8.8 1.8 4.1 3.7 2.5 8.6l2.1 4.1 4.9 1.4 3.3-3.2-1.2-2.2 1.1-5.5Z' fill='none' stroke='%23eeeDE7' stroke-width='.65'/%3E%3Cpath d='m9.8 2.4-1.4 3 .8 2.1-1.3 2.8.8 3.2' fill='none' stroke='%23eeeDE7' stroke-width='.5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="../shared/content.js" defer></script>
    <script src="./world.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <body data-phase="void">
    <a class="skip-link" href="#experience-copy">跳到体验说明</a>

    <div class="void-depth" aria-hidden="true"></div>

    <div class="statement-space" aria-hidden="true">
      <p class="statement-line statement-line--near">我试图穿过世界的表象，</p>
      <p class="statement-line statement-line--far">寻找未被命名的真实。</p>
    </div>

    <canvas id="consciousness-world" aria-hidden="true"></canvas>

    <div class="world-fallback" aria-hidden="true">
      <span class="fallback-shell"></span>
      <span class="fallback-facet fallback-facet--one"></span>
      <span class="fallback-facet fallback-facet--two"></span>
      <span class="fallback-crack"></span>
    </div>

    <main id="experience-copy">
      <h1 class="sr-only">Self-Awake：意识形成与世界印痕</h1>

      <div class="spatial-signature" aria-label="Self-Awake 署名">
        <span>self-awake</span>
        <span>self-awareness</span>
      </div>

      <div class="phase-name" aria-hidden="true">
        <strong>观象</strong>
      </div>

      <blockquote class="observation-thesis sr-only">
        世界不断经过，<br />只有真正看见的事物才留下形状。
      </blockquote>

      <button class="approach-cue" type="button" data-enter-observation aria-label="继续靠近意识核心">
        <span class="sr-only">继续靠近</span>
      </button>

      <button class="imprint-entry" type="button" data-open-imprint aria-label="阅读：从能回答，到能交付">
        <span class="sr-only">从能回答，到能交付</span>
      </button>

      <p class="causal-caption sr-only" role="status" aria-live="polite"></p>
      <p class="assistive-status sr-only" aria-live="polite">黑暗仍未发生。</p>
    </main>

    <div class="coordinate-cursor" aria-hidden="true">
      <span class="coordinate-cursor__point"></span>
    </div>

    <div class="reality-controls" aria-label="现实锚点">
      <button class="sound-toggle" type="button" data-sound-toggle aria-pressed="false">
        <span>声音</span>
        <output>关闭</output>
      </button>
      <button class="reality-anchor" type="button" data-open-anchor aria-haspopup="dialog">
        <span>菜单</span>
      </button>
    </div>

    <dialog class="anchor-dialog" id="anchor-dialog" aria-labelledby="anchor-title">
      <div class="anchor-shell">
        <header>
          <div>
            <p>REALITY ANCHOR / 不需要完成沉浸体验</p>
            <h2 id="anchor-title">回到清晰的平面</h2>
          </div>
          <button type="button" data-close-anchor>关闭</button>
        </header>

        <nav aria-label="稳定网站入口">
          <button type="button" data-anchor-view="articles"><span>文章</span><small>全部文字索引</small></button>
          <button type="button" data-anchor-view="search"><span>搜索</span><small>标题、主题或年份</small></button>
          <button type="button" data-anchor-view="time"><span>时间</span><small>按发表日期排列</small></button>
          <button type="button" data-return-core><span>返回核心</span><small>重新观看已改变的结构</small></button>
        </nav>

        <div class="archive-tools">
          <label for="archive-search">输入一个词</label>
          <input id="archive-search" type="search" autocomplete="off" placeholder="证据、系统、2026…" />
          <output class="archive-count" aria-live="polite"></output>
        </div>

        <div class="archive-list" id="archive-list"></div>

        <footer>
          <p>本原型不连接外部服务。阅读痕迹与结构变化只保存在当前浏览器。</p>
          <button type="button" data-clear-memory>清除本地痕迹</button>
        </footer>
      </div>
    </dialog>

    <dialog class="reader-dialog" id="reader-dialog" aria-labelledby="reader-title">
      <div class="reader-shell">
        <header class="reader-controls">
          <button type="button" data-close-reader>返回意识表面</button>
          <p><span>安静阅读</span><i aria-hidden="true"></i></p>
        </header>
        <article>
          <p class="reader-meta"></p>
          <h2 id="reader-title">文章标题</h2>
          <p class="reader-summary"></p>
          <div class="reader-body"></div>
        </article>
      </div>
    </dialog>

    <section class="semantic-fallback" aria-label="静态内容入口">
      <h2>世界留下印痕</h2>
      <p>我试图穿过世界的表象，寻找未被命名的真实。</p>
      <p>世界不断经过，只有真正看见的事物才留下形状。</p>
      <button type="button" data-open-anchor>打开文章索引</button>
    </section>

    <noscript>
      <style>
        #consciousness-world,
        .statement-space,
        .coordinate-cursor,
        .reality-controls,
        #experience-copy {
          display: none !important;
        }
        .semantic-fallback {
          display: grid !important;
        }
      </style>
    </noscript>
  </body>
</html>
