<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Self-Awake 莫比乌斯小尺寸标</title>
  <desc id="desc">一条骨白厚带形成两个不完全对称的回环，并在中心发生唯一一次上下穿越。</desc>
  <defs>
    <mask id="underpass">
      <rect width="64" height="64" fill="white"/>
      <circle cx="32" cy="32" r="4.4" fill="black"/>
    </mask>
  </defs>
  <path d="M7 32C13 17 25 16 32 32C39 48 51 47 57 32" fill="none" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" mask="url(#underpass)"/>
  <path d="M57 32C51 17 39 17 32 32C25 47 13 47 7 32" fill="none" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
